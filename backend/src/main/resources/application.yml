spring:
    application:
        name: backend
    config:
        # Importation native du fichier .env
        import: "optional:file:.env[.properties]"

    datasource:
        # Utilisation des variables définies dans le .env
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        show-sql: true
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: create

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USER}
        password: ${MAIL_PASS}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                    timeout: 5000
                    connectiontimeout: 5000
                    writetimeout: 5000

    threads:
        virtual:
            enabled: true

server:
    port: ${SERVER_PORT:8080}
