spring:
    application:
        name: pharmacyview
    thread:
        virtual:
            enabled: true
    server:
        port: ${PORT}
    datasource:
        url: jdbc:postgresql://localhost:5432/pharmacyview
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
