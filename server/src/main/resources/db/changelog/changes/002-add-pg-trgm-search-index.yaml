databaseChangeLog:
  - changeSet:
      id: 002-add-pg-trgm-search-index
      author: bob-pharma
      changes:
        - sql:
            comment: Enable pg_trgm extension for fuzzy text search
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - createIndex:
            tableName: drug
            indexName: idx_drug_name_trgm
            columns:
              - column:
                  name: name
            createIndex: GIST
            using: gist
            where: name % ''